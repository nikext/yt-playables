name: Deploy games to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check Playables compliance
        run: |
          for g in prism-runner lantern-links island-ferry; do
            node tools/check-bundle.mjs "$g"
            cmp shared/ytsdk.js "$g/ytsdk.js"
          done

      - name: Assemble site
        run: |
          mkdir -p _site
          cp -r site/. _site/
          for g in prism-runner lantern-links island-ferry; do
            mkdir -p "_site/$g"
            cp -r "$g/." "_site/$g/"
            rm -f "_site/$g/README.md"
          done
          touch _site/.nojekyll
          find _site -type f | sort

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
